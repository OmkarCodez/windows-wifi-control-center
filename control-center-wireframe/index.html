<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Center — Wireframe Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #e9edf1; color: #28313b; font-family: Inter, Arial, sans-serif; }

    main { max-width: 1536px; margin: 0 auto; background: #f1f3f5; border: 1px solid #c8ced6; border-radius: 12px; overflow: auto; }
    img { width: 100%; height: auto; min-width: 760px; display: block; }

  <header>
    <h1>Control Center — Low-fidelity Wireframe</h1>
